name: main-abc

services:
  ## FRONTEND
  frontend:
    networks:
      - abc
    image: dmcsweeney/bodycomp-frontend
    ports:
      - ${FRONTEND_PORT}:5000
    volumes:
      - ./frontend/src:/app/src
      - ./ssl/cert.key:/ssl/cert.key:ro
      - ./ssl/cert.crt:/ssl/cert.crt:ro
    environment:
      - VITE_BACKEND_URI=${VITE_BACKEND_URI}
      - VITE_BACKEND_PORT=${BACKEND_PORT}
      - VITE_MONGO_EXPRESS_PORT=${MONGO_EXPRESS_PORT}
      - VITE_ORTHANC_HTTP_PORT=${ORTHANC_HTTP_PORT}
    depends_on:
      - backend
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  ## THE MAIN SERVICE

  backend:
    networks:
      - abc
    image: dmcsweeney/bodycomp-backend

    ports:
      - 5001:5001
    volumes:
      - ${INPUT_DIR}:/data/inputs:ro
      - ${OUTPUT_DIR}:/data/outputs
      - ./backend/src:/src
      - ${INPUT_DIR}/logs:/var/log
      - ./ssl/cert.key:/ssl/cert.key:ro
      - ./ssl/cert.crt:/ssl/cert.crt:ro
      - dicom-inbox:/data/inbox
    command: flask run --cert=/ssl/cert.crt --key=/ssl/cert.key
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=${BACKEND_PORT}
      - HOST_IP=${HOST_IP}
      - BACKEND_PORT=${BACKEND_PORT}
      - MONGO_PORT=${MONGO_PORT}
      - REDIS_PORT=${REDIS_PORT}
      - FLASK_DEBUG=True
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - ORTHANC_USER=${ORTHANC_USER}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - mongo
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  ## ORTHANC SERVICE - handles dicom comms.
  orthanc:
    networks:
      - abc
    image: dmcsweeney/bodycomp-orthanc
    ports:
      - ${ORTHANC_HTTP_PORT}:8042
      - ${ORTHANC_DICOM_PORT}:4242
    volumes:
      - ./orthanc/trigger.py:/scripts/trigger.py:ro
      - dicom-inbox:/var/lib/orthanc/db
    environment:
      - ORTHANC__NAME=ABCtoolkit
      - ORTHANC__DICOM_AET=ABCTOOLKIT
      - ORTHANC__DICOM_PORT=4242
      - ORTHANC__HTTP_PORT=8042
      - ORTHANC__STABLE_AGE=5
      - ORTHANC__REMOTE_ACCESS_ALLOWED=true
      - ORTHANC__AUTHENTICATION_ENABLED=true
      - ORTHANC__REGISTERED_USERS={"${ORTHANC_USER}":"${ORTHANC_PASSWORD}"}
      - ORTHANC__PYTHON_SCRIPT=/scripts/trigger.py
      - PYTHON_PLUGIN_ENABLED=true

  ## NoSQL database
  mongo:
    networks:
      - abc
    image: "mongo:6.0-jammy"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - ./data/db:/data/db
    ports:
      - ${MONGO_PORT}:27017
    logging:
      driver: "none"
    command: mongod --quiet --logpath /dev/null

## Web server for the db, useful for debugging
  mongo-express:
    networks:
      - abc
    image: "mongo-express:1.0.2"
    volumes:
      - ./ssl/cert.key:/ssl/cert.key:ro
      - ./ssl/cert.crt:/ssl/cert.crt:ro
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017
      - ME_CONFIG_MONGODB_PORT=${MONGO_PORT}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_MONGODB_AUTH_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_AUTH_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGOEXPRESS_LOGIN}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGOEXPRESS_PASSWORD}
      - ME_CONFIG_SITE_SSL_ENABLED=true
      - ME_CONFIG_SITE_SSL_CRT_PATH=/ssl/cert.crt
      - ME_CONFIG_SITE_SSL_KEY_PATH=/ssl/cert.key
    depends_on:
      - mongo
    ports:
      - ${MONGO_EXPRESS_PORT}:8081
    restart: always

  ## Redis -- Job queue
  redis:
    networks:
      - abc
    image: redis:7.2.4
    ports:
      - ${REDIS_PORT}:6379

  ## Worker processes
  gpu-workers:
    networks:
      - abc
    image: dmcsweeney/bodycomp-backend
    command: rq worker -u redis://redis:6379 high default low
    volumes:
      - ${INPUT_DIR}:/data/inputs:ro
      - ${OUTPUT_DIR}:/data/outputs
      - ./backend/src:/src
      - dicom-inbox:/data/inbox
    environment:
      - FLASK_DEBUG=True
      - HOST_IP=${HOST_IP}
      - BACKEND_PORT=${BACKEND_PORT}
      - MONGO_PORT=${MONGO_PORT}
      - REDIS_PORT=${REDIS_PORT}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - ORTHANC_USER=${ORTHANC_USER}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
    deploy:
      replicas: ${NUM_GPU_WORKERS}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    depends_on:
      - redis

  cpu-workers:
    networks:
      - abc
    image: dmcsweeney/bodycomp-backend
    
    command: rq worker -u redis://redis:6379 default low
    volumes:
      - ${INPUT_DIR}:/data/inputs:ro
      - ${OUTPUT_DIR}:/data/outputs
      - ./backend/src:/src
      - dicom-inbox:/data/inbox
    environment:
      - FLASK_DEBUG=True
      - HOST_IP=${HOST_IP}
      - BACKEND_PORT=${BACKEND_PORT}
      - MONGO_PORT=${MONGO_PORT}
      - REDIS_PORT=${REDIS_PORT}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - ORTHANC_USER=${ORTHANC_USER}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
    deploy:
      replicas: ${NUM_CPU_WORKERS}
    depends_on:
      - redis

## Should everything be a volume?

volumes:
  dicom-inbox:

networks:
  abc:
    driver: bridge
